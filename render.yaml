services:
  - type: web
    name: webtienganhn-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn webtienganhn.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: webtienganhn.settings
      - key: PYTHON_VERSION
        value: 3.11
